<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Auto Meet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b16; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; font: 12px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: .08em; color: rgba(190, 205, 255, .35); pointer-events: none; }
</style></head>
<body><canvas id="c"></canvas><div class="tag" id="tag">Auto Meet</div>
<script>
  try { const d = JSON.parse(decodeURIComponent(location.hash.slice(1))); if (d.name) document.getElementById('tag').textContent = 'Auto Meet · ' + d.name; } catch (e) { /* без підпису */ }
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * .6, r: Math.random() * 1.2 + .3, p: Math.random() * 6.28, s: .4 + Math.random() * .8 }));
  const layers = [ // колір, висота (частка), амплітуда, довжина хвилі, швидкість
    ['rgba(32, 62, 120, .55)', .60, 26, 520, .18], ['rgba(36, 78, 140, .55)', .66, 30, 420, .26],
    ['rgba(40, 96, 156, .6)', .72, 34, 360, .34], ['rgba(30, 112, 160, .65)', .79, 30, 300, .42],
    ['rgba(16, 70, 112, .85)', .87, 26, 240, .52],
  ];
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', resize); resize();
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 33) return; last = t; // ~30 кадрів/с — щоб не гріти ноутбук
    const s = t / 1000;
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#060a18'); sky.addColorStop(.55, '#0d1b3a'); sky.addColorStop(1, '#10305a');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    for (const st of stars) { g.globalAlpha = .25 + .6 * (.5 + .5 * Math.sin(s * st.s + st.p)); g.fillStyle = '#dfe8ff'; g.beginPath(); g.arc(st.x * W, st.y * H, st.r, 0, 6.28); g.fill(); }
    g.globalAlpha = 1;
    const mx = W * .78, my = H * .2, mr = Math.min(W, H) * .055; // місяць
    const halo = g.createRadialGradient(mx, my, mr * .6, mx, my, mr * 4.5);
    halo.addColorStop(0, 'rgba(190,210,255,.28)'); halo.addColorStop(1, 'rgba(190,210,255,0)');
    g.fillStyle = halo; g.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
    g.fillStyle = '#e8eeff'; g.beginPath(); g.arc(mx, my, mr, 0, 6.28); g.fill();
    layers.forEach(([col, y0, amp, len, sp], i) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) {
        const y = H * y0 + Math.sin(x / len * 6.28 + s * sp * 2 + i) * amp + Math.sin(x / (len * .43) * 6.28 - s * sp * 1.3) * amp * .35;
        g.lineTo(x, y);
      }
      g.lineTo(W, H); g.closePath(); g.fill();
    });
  }
  requestAnimationFrame(frame);
</script></body></html>
