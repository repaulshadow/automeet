name: update-manifest

# Кладіть у репозиторій як .github/workflows/update-manifest.yml
# Після кожного завантаження файлів сам перерахує manifest.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python make_manifest.py
      - run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || (git commit -m "Update manifest" && git push)
