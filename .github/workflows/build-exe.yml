name: build-apps

# Кладіть у репозиторій як .github/workflows/build-exe.yml
# Запуск вручну: вкладка Actions -> build-apps -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install playwright==1.48.0 pyinstaller==6.11.1

      - name: Build AutoMeet.exe
        run: pyinstaller --onefile --name AutoMeet --collect-all playwright auto_meet.py

      - uses: actions/upload-artifact@v7
        with:
          name: AutoMeet-windows
          path: dist/AutoMeet.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install playwright==1.48.0 pyinstaller==6.11.1

      - name: Build AutoMeet (macOS)
        run: |
          pyinstaller --onefile --name AutoMeet --collect-all playwright auto_meet.py
          # tar зберігає право на запуск (zip від GitHub його губить)
          tar -czf dist/AutoMeet-mac.tar.gz -C dist AutoMeet

      - uses: actions/upload-artifact@v7
        with:
          name: AutoMeet-macos
          path: dist/AutoMeet-mac.tar.gz

  macos-intel:
    runs-on: macos-15-intel   # Mac з процесором Intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install playwright==1.48.0 pyinstaller==6.11.1

      - name: Build AutoMeet (macOS Intel)
        run: |
          pyinstaller --onefile --name AutoMeet --collect-all playwright auto_meet.py
          tar -czf dist/AutoMeet-mac-intel.tar.gz -C dist AutoMeet

      - uses: actions/upload-artifact@v7
        with:
          name: AutoMeet-macos-intel
          path: dist/AutoMeet-mac-intel.tar.gz
