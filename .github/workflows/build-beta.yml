name: build-beta

# Основна програма (Electron, папка beta/). Старий Python-скрипт у корені лишається
# лише для тих, хто його вже встановив (автооновлення з main).
# Запуск: push у main/beta зі змінами в beta/, тег v*, або вручну: Actions -> build-beta -> Run workflow.
on:
  workflow_dispatch:
  pull_request:             # перевірка збірки у PR (зокрема від Dependabot); реліз тут не створюється
    paths: ["beta/**", ".github/workflows/build-beta.yml"]
  push:
    branches: [main, beta]
    tags: ["v*"]            # тег v0.2.0 / v0.2.0-beta.1 => збірка + GitHub Release з інсталяторами
    paths-ignore:
      - "**.md"

# Мінімальні права за замовчуванням; job release нижче окремо отримує contents: write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: beta } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: beta/package-lock.json }
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: TZ=Europe/Kyiv npm test

  mac:
    needs: test
    runs-on: macos-latest
    defaults: { run: { working-directory: beta } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: beta/package-lock.json }
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build (signed + notarized if secrets are set)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set +e
          if [ -z "$CSC_LINK" ]; then
            echo "Сертифіката Apple немає — збираю БЕЗ підпису (macOS покаже попередження)."
            # порожня змінна CSC_LINK ламає electron-builder («not a file») — прибираємо її
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            ARGS="--mac --config.mac.notarize=false"
          elif [ -z "$APPLE_ID" ]; then
            echo "Підписую, але без нотаризації (немає APPLE_ID)."
            ARGS="--mac --config.mac.notarize=false"
          else
            ARGS="--mac"
          fi
          DEBUG=electron-builder npx electron-builder $ARGS 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # виводимо хвіст журналу як помилку (видно в анотаціях без завантаження логів)
            (grep -nE '⨯|rror|fail|denied|invalid' build.log | grep -v 'exited' | head -n 15; tail -n 6 build.log) | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::${line:0:300}"; done
            exit $code
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMeetBeta-macos
          path: |
            beta/dist/*.dmg
            beta/dist/*-mac.zip

  windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { working-directory: beta } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: beta/package-lock.json }
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoMeetBeta-windows
          path: beta/dist/*.exe

  release:
    # Публікує інсталятори у GitHub Release з ПОСТІЙНИМИ іменами файлів
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Постійні імена файлів
        run: |
          mkdir out
          cp artifacts/AutoMeetBeta-windows/*Setup*.exe out/AutoMeet-Windows.exe
          cp artifacts/AutoMeetBeta-macos/*arm64*.dmg   out/AutoMeet-macOS-arm64.dmg
          cp artifacts/AutoMeetBeta-macos/*x64*.dmg     out/AutoMeet-macOS-intel.dmg
          ls -la out
      - name: Створити/оновити Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Auto Meet $TAG" --generate-notes $PRE
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
